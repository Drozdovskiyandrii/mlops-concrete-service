name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q


  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set variables
        run: |
          echo "ECR_URI=794550284417.dkr.ecr.us-east-2.amazonaws.com/mlops-concrete-service" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Docker image (SHA)
        run: |
          docker build -f docker/Dockerfile -t "${ECR_URI}:${IMAGE_TAG}" .

      - name: Push Docker image (SHA)
        run: |
          docker push "${ECR_URI}:${IMAGE_TAG}"

      - name: Tag and push latest
        run: |
          docker tag "${ECR_URI}:${IMAGE_TAG}" "${ECR_URI}:latest"
          docker push "${ECR_URI}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ./deploy.sh ${{ github.sha }}
